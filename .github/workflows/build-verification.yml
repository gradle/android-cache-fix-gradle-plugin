name: Verify Build

on:
  push:
    branches: [ main, citest ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ARTIFACT_CACHE_STORE: "true"

jobs:
  generate_versions:
    name: Generate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: setup-matrix
        shell: bash
        run: |
          set -euo pipefail
          json_to_matrix() {
            file="src/test/resources/versions.json"
            jq -cM '.testedVersions | keys' "$file" | sed -e 's/\./_/g' -e 's/-/_/g'
          }
          json_to_matrix
          echo "matrix=$(json_to_matrix)" >> $GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.matrix }}

  sanity_check:
    name: Sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Get GitHub OIDC token for setup-gradle
        id: develocity-oidc
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://ge.solutions-team.gradle.com" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          echo "access-key=ge.solutions-team.gradle.com=$token" >> "$GITHUB_OUTPUT"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true
          develocity-access-key: ${{ steps.develocity-oidc.outputs.access-key }}
      - name: Setup Develocity Artifact Cache
        uses: gradle/develocity-artifact-cache-github-action@0d55463728b4cb8d76aab3399fcf261cf1fc4fe5 # v1.1.1
        with:
          develocity-edge-url: https://usw2-edge.solutions-team.gradle.com
          develocity-auth: workload-identity
          develocity-oidc-audience: https://ge.solutions-team.gradle.com
          cli-version: 1.4.0
          cache-read-only: ${{ env.ARTIFACT_CACHE_STORE != 'true' }}
      - name: Run sanityCheck
        run: ./gradlew sanityCheck -Porg.gradle.java.installations.auto-download=false

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Get GitHub OIDC token for setup-gradle
        id: develocity-oidc
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://ge.solutions-team.gradle.com" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          echo "access-key=ge.solutions-team.gradle.com=$token" >> "$GITHUB_OUTPUT"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true
          develocity-access-key: ${{ steps.develocity-oidc.outputs.access-key }}
      - name: Setup Develocity Artifact Cache
        uses: gradle/develocity-artifact-cache-github-action@0d55463728b4cb8d76aab3399fcf261cf1fc4fe5 # v1.1.1
        with:
          develocity-edge-url: https://usw2-edge.solutions-team.gradle.com
          develocity-auth: workload-identity
          develocity-oidc-audience: https://ge.solutions-team.gradle.com
          cli-version: 1.4.0
          cache-read-only: ${{ env.ARTIFACT_CACHE_STORE != 'true' }}
      - name: Run unit tests
        run: >-
            ./gradlew test
            -x signPluginMavenPublication
            -x signAndroidCacheFixPluginPluginMarkerMavenPublication
            -Porg.gradle.java.installations.auto-download=false
            -Dpts.mode=$PTS_MODE
        env:
          PTS_MODE: "${{ github.ref_name == 'main' && 'REMAINING_TESTS' || 'RELEVANT_TESTS' }}"

  android_version_tests:
    name: Android version tests
    needs: [ generate_versions, sanity_check ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions: ${{ fromJson(needs.generate_versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup ZULU_JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 17.0.16+8
          distribution: 'zulu'
      - name: Set ZULU_JDK environment variable
        run: |
          echo "ZULU_JDK=$JAVA_HOME" >> $GITHUB_ENV
      - name: Setup ZULU_ALT_JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 17.0.10+7
          distribution: 'zulu'
      - name: Set ZULU_ALT_JDK environment variable
        run: |
          echo "ZULU_ALT_JDK=$JAVA_HOME" >> $GITHUB_ENV
      - name: Set up Java 11
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 11
          distribution: 'temurin'
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Get GitHub OIDC token for setup-gradle
        id: develocity-oidc
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://ge.solutions-team.gradle.com" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          echo "access-key=ge.solutions-team.gradle.com=$token" >> "$GITHUB_OUTPUT"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true
          develocity-access-key: ${{ steps.develocity-oidc.outputs.access-key }}
      - name: Setup Develocity Artifact Cache
        uses: gradle/develocity-artifact-cache-github-action@0d55463728b4cb8d76aab3399fcf261cf1fc4fe5 # v1.1.1
        with:
          develocity-edge-url: https://usw2-edge.solutions-team.gradle.com
          develocity-auth: workload-identity
          develocity-oidc-audience: https://ge.solutions-team.gradle.com
          cli-version: 1.4.0
          cache-read-only: ${{ env.ARTIFACT_CACHE_STORE != 'true' }}
      - name: Run integration tests
        run: >-
            ./gradlew testAndroid${{ matrix.versions }}
            -x signPluginMavenPublication
            -x signAndroidCacheFixPluginPluginMarkerMavenPublication
            -Porg.gradle.java.installations.auto-download=false
            -Dpts.mode=$PTS_MODE
        env:
          PTS_MODE: "${{ github.ref_name == 'main' && 'REMAINING_TESTS' || 'RELEVANT_TESTS' }}"

